name: Remote Blender 3D Renderer

on:
  workflow_dispatch:
    inputs:
      scene_title:
        description: 'Title or goal for 3D scene'
        required: false
        default: 'Project Beyond 3D Scene'
      script_content:
        description: 'Base64 encoded Python bpy script (leave AUTO or empty to use repo test_scene.b64)'
        required: false
        default: 'AUTO'
      resolution_x:
        description: 'Render resolution width (pixels)'
        required: false
        default: '800'
      resolution_y:
        description: 'Render resolution height (pixels)'
        required: false
        default: '600'

permissions:
  contents: read
  actions: write

jobs:
  render:
    name: Headless Blender Render
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender on Runner
        run: |
          echo "Updating apt package index..."
          sudo apt-get update -qq
          echo "Installing Blender & Mesa OpenGL libraries..."
          sudo apt-get install -y --no-install-recommends blender libglu1-mesa
          echo "Blender installation complete. Probing version:"
          blender --version

      - name: Prepare Working Directory & Script
        env:
          SCRIPT_CONTENT: ${{ github.event.inputs.script_content }}
        run: |
          mkdir -p output
          echo "Preparing Python scene generation script..."

          if [ -z "$SCRIPT_CONTENT" ] || [ "$SCRIPT_CONTENT" = "AUTO" ] || [ "$SCRIPT_CONTENT" = "DEFAULT" ]; then
            echo "Using repository test_scene.b64 payload..."
            base64 -d test_scene.b64 > scene.py
          else
            echo "Decoding provided script_content input..."
            echo "$SCRIPT_CONTENT" | base64 -d > scene.py
          fi

          if grep -q "bpy\.mathutils" scene.py; then
            echo "::warning::Correcting legacy bpy.mathutils references..."
            sed -i 's/bpy\.mathutils/mathutils/g' scene.py
            if ! grep -q "import mathutils" scene.py; then
              sed -i '1s/^/import mathutils\n/' scene.py
            fi
          fi

          if grep -q "bpy\.mathutils" scene.py; then
            echo "::error::Invalid bpy.mathutils references remain."
            exit 1
          fi

          echo "Pre-flight verification passed."
          head -n 30 scene.py

      - name: Disable Unsupported Cycles Denoising
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scene.py")
          source = path.read_text()

          # Insert the compatibility setting before the render call.
          render_line = "bpy.ops.render.render(write_still=True)"

          if render_line not in source:
              print("Expected render call not found; leaving script unchanged.")
              raise SystemExit(1)

          patch = (
              'if bpy.context.scene.render.engine == "CYCLES":\n'
              '    bpy.context.scene.cycles.use_denoising = False\n'
          )

          source = source.replace(render_line, patch + render_line, 1)
          path.write_text(source)
          print("Cycles denoising compatibility setting added.")
          PY

      - name: Execute Headless Blender Render
        run: |
          echo "Starting headless render via Blender..."
          blender -b --python-exit-code 1 -P scene.py

      - name: Verify Rendered Outputs
        run: |
          echo "Locating and verifying generated files..."

          if [ -s "output/scene.blend" ]; then
            cp output/scene.blend ./scene.blend
          fi

          if [ -s "output/render.png" ]; then
            cp output/render.png ./render.png
          fi

          if [ ! -s "scene.blend" ]; then
            FOUND_BLEND=$(find . -maxdepth 5 -name "scene.blend" -size +0c -not -path "*/.git/*" | head -n 1)
            if [ -n "$FOUND_BLEND" ]; then
              cp "$FOUND_BLEND" ./scene.blend
            fi
          fi

          if [ ! -s "render.png" ]; then
            FOUND_PNG=$(find . -maxdepth 5 -name "render.png" -size +0c -not -path "*/.git/*" | head -n 1)
            if [ -n "$FOUND_PNG" ]; then
              cp "$FOUND_PNG" ./render.png
            fi
          fi

          if [ ! -s "scene.blend" ]; then
            echo "::error::scene.blend missing or empty."
            exit 1
          fi

          if [ ! -s "render.png" ]; then
            echo "::error::render.png missing or empty."
            exit 1
          fi

          PNG_HEX=$(head -c 4 render.png | xxd -p)
          if [ "$PNG_HEX" != "89504e47" ]; then
            echo "::error::Invalid PNG header: $PNG_HEX"
            exit 1
          fi

          echo "Verification successful."
          echo "scene.blend: $(stat -c%s scene.blend) bytes"
          echo "render.png: $(stat -c%s render.png) bytes"

      - name: Upload Verified 3D Render Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blender-render-artifacts
          path: |
            render.png
            scene.blend
          if-no-files-found: error
          retention-days: 1
