<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Beyond</title>
<style>
:root{--bg:#07081a;--panel:#0e1030;--panel2:#141745;--line:#262a66;--text:#e6e9ff;--mute:#9399cc;--blue:#3ea8ff;--purple:#a45bff;--ok:#3df5b0;--warn:#ffc857;--err:#ff4d7d;
--glow:0 0 18px rgba(62,168,255,.35);--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:radial-gradient(900px 500px at 85% -10%,rgba(164,91,255,.18),transparent),radial-gradient(800px 500px at 0% 100%,rgba(62,168,255,.14),transparent),var(--bg);color:var(--text);font-family:var(--sans);display:flex}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
aside{width:232px;flex:none;border-right:1px solid var(--line);background:rgba(14,16,48,.7);padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:1.25rem;letter-spacing:.02em;padding:0 10px 18px;background:linear-gradient(90deg,var(--blue),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font:400 .72rem var(--mono);color:var(--mute);-webkit-text-fill-color:var(--mute);margin-top:2px}
nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--mute);text-decoration:none;border:1px solid transparent}
nav a:hover{color:var(--text);background:var(--panel2)}
nav a.on{color:#fff;background:linear-gradient(90deg,rgba(62,168,255,.18),rgba(164,91,255,.18));border-color:var(--line);box-shadow:var(--glow)}
nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.side-note{margin-top:auto;font:400 .72rem/1.5 var(--mono);color:var(--mute);padding:10px;border:1px dashed var(--line);border-radius:10px}
main{flex:1;min-width:0;padding:26px clamp(16px,3vw,36px) 40px}
.banner{display:flex;gap:10px;align-items:center;border-radius:10px;padding:10px 14px;font-size:.88rem;margin-bottom:16px;background:rgba(62,168,255,.08);border:1px solid rgba(62,168,255,.4);color:#a9d6ff}
.banner.err{background:rgba(255,77,125,.1);border-color:var(--err);color:#ffb3c6}
h1{margin:0 0 4px;font-size:1.7rem}h2{margin:0 0 12px;font-size:1.05rem}
.sub{color:var(--mute);margin:0 0 22px}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:22px}
.cols{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.agents{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:16px}
.stat b{display:block;font-size:1.9rem;font-weight:700}.stat span{color:var(--mute);font-size:.85rem}
.stat.b b{color:var(--blue);text-shadow:0 0 14px rgba(62,168,255,.6)}.stat.p b{color:var(--purple);text-shadow:0 0 14px rgba(164,91,255,.6)}
.stat.g b{color:var(--ok)}.stat.r b{color:var(--err)}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 .74rem var(--mono);padding:3px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.s-pending,.s-queued{color:var(--warn)}.s-progress,.s-running{color:var(--blue)}.s-paused{color:#e0a0ff}.s-done,.s-completed{color:var(--ok)}.s-failed{color:var(--err)}.s-nc{color:#ff8fb0}
.bar{height:8px;border-radius:99px;background:#0a0b26;border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));box-shadow:0 0 10px var(--purple);transition:width .3s}
.bar.d i{background:var(--ok);box-shadow:none}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ag h3{margin:10px 0 2px;font-size:1.05rem}.ag p{margin:0 0 12px;color:var(--mute);font-size:.86rem;min-height:2.6em}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:rgba(62,168,255,.12);border:1px solid var(--line)}
.btn{background:transparent;border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--blue);box-shadow:var(--glow)}
.btn.pri{background:linear-gradient(90deg,var(--blue),var(--purple));border:0;color:#050616;font-weight:700}
.btn.on{border-color:var(--purple);background:rgba(164,91,255,.2)}
.btn.sm{padding:4px 10px;font-size:.82rem}.btn:disabled{opacity:.45;cursor:not-allowed}
form.new{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px}
input[type=text],select,textarea{background:#0a0b26;border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:0;width:100%;color:var(--text);font-family:inherit;font-size:inherit}
input[aria-invalid=true],textarea[aria-invalid=true]{border-color:var(--err)}
.ferr{color:#ff9db8;font-size:.85rem;margin:8px 0 0;min-height:1.2em}
.task{display:grid;gap:8px;margin-bottom:12px}
.task select{width:auto;padding:5px 8px;font-size:.85rem}
.mono{font-family:var(--mono);font-size:.8rem}.mute{color:var(--mute)}
.log{font:400 .8rem/1.5 var(--mono);padding:7px 10px;border-left:3px solid var(--line);margin-bottom:6px;background:rgba(10,11,38,.6);border-radius:0 8px 8px 0;overflow-wrap:anywhere}
.log.error{border-color:var(--err);color:#ffb3c6}.log.warn{border-color:var(--warn)}.log.info{border-color:var(--blue)}.log.ok{border-color:var(--ok)}
.tag{font:500 .68rem var(--mono);color:var(--mute);border:1px dashed var(--line);border-radius:6px;padding:1px 5px;margin-left:6px}
.set{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}.set small{display:block;color:var(--mute)}
.empty{color:var(--mute);padding:22px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--text);margin-bottom:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 14px}
@media(max-width:820px){
 body{display:block;padding-bottom:76px}
 aside{position:fixed;inset:auto 0 0 0;width:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5;border:0;border-top:1px solid var(--line);background:rgba(14,16,48,.95)}
 .brand,.side-note{display:none}nav{display:flex;width:100%;justify-content:space-around}
 nav a{flex-direction:column;gap:2px;font-size:.68rem;padding:6px 4px}
 form.new{grid-template-columns:1fr}
}
.wf-card{border-left:4px solid var(--blue)}
.wf-subtasks{margin-top:14px;padding-left:14px;border-left:2px solid var(--line);display:grid;gap:8px}
.wf-subtask{background:rgba(10,11,38,.7);border:1px solid var(--line);border-radius:8px;padding:10px}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<aside>
  <div class="brand">PROJECT BEYOND<small>command center · prototype</small></div>
  <nav id="nav" aria-label="Main"></nav>
  <div class="side-note">Free-First mode on by default. API keys stored in local .env.</div>
</aside>
<main id="view"></main>

<script>
/* PROJECT BEYOND — local prototype. No network calls, no API keys, no paid services.
   To extend later: replace the `store` functions with calls to your own backend. */
const ICONS={dashboard:'<path d="M3 12l9-9 9 9M5 10v10h5v-6h4v6h5V10"/>',agents:'<rect x="5" y="7" width="14" height="11" rx="3"/><path d="M12 3v4M9 12h.01M15 12h.01"/>',tasks:'<path d="M4 6h16M4 12h16M4 18h10"/>',workflows:'<path d="M4 4h6v6H4zM14 4h6v6h-6zM9 14h6v6H9zM7 10v2a2 2 0 0 0 2 2h2m4-4v2a2 2 0 0 1-2 2h-2"/>',tools:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',logs:'<path d="M5 4h14v16H5zM9 9h6M9 13h6"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
const SECTIONS=[['dashboard','Dashboard'],['agents','AI Agents'],['tasks','Task Manager'],['workflows','AI Workflows'],['tools','Free Toolkit'],['logs','Activity Logs'],['settings','Settings']];
const AGENTS=[
 {id:'coding',name:'Coding Agent',icon:'💻',tier:'REAL',engine:'Google Gemini & Ollama',desc:'Writes, reviews, refactors, and explains clean code. Checkpointed multi-step execution.'},
 {id:'research',name:'Research Agent',icon:'🔎',tier:'REAL',engine:'Wikipedia API + Gemini',desc:'Fetches genuine encyclopedia sources and synthesizes factual research briefs with verified citations.'},
 {id:'sketch',name:'Sketch Agent',icon:'✏️',tier:'PARTIAL',engine:'Gemini Layout Engine',desc:'Generates ASCII wireframes, component layouts, and UI hierarchy specs. (Raster graphics not included).'},
 {id:'graphics',name:'Graphics Agent',icon:'🎨',tier:'PARTIAL',engine:'Gemini Vector Engine',desc:'Generates standalone SVG vector graphics, icons, and diagrams. (Diffusion raster models require external API).'},
 {id:'video',name:'Video Agent',icon:'🎬',tier:'MOCK',engine:'Script / Concept Only',desc:'Plans storyboards, scene descriptions, and voiceover scripts. (Actual MP4 video rendering engine is not installed).'}];
const STATUS={pending:'Queued',queued:'Queued',progress:'Running',running:'Running',paused:'Paused',done:'Completed',completed:'Completed',failed:'Failed'};
const PCT={pending:0,queued:0,progress:50,running:50,paused:35,done:100,completed:100,failed:0};
const KEY='project-beyond-v2';

const now=Date.now();
const seed=()=>({nextId:4,
 settings:{freeFirst:true},
 ollama:{connected:false,models:[]},
 providers:[],
 blender:{available:false,executable:null,version:null},
 tasks:[
  {id:1,title:'Outline login page layout',agent:'sketch',priority:'Medium',status:'progress'},
  {id:2,title:'List free hosting options',agent:'research',priority:'High',status:'pending'},
  {id:3,title:'Choose project color palette',agent:'graphics',priority:'Low',status:'done'}],
 logs:[
  {t:now-600000,lvl:'info',msg:'Project Beyond started in local prototype mode.',sample:1},
  {t:now-540000,lvl:'ok',msg:'Free-First mode is enabled.',sample:1},
  {t:now-480000,lvl:'warn',msg:'No AI provider configured. Agents are Not Connected.',sample:1},
  {t:now-300000,lvl:'error',msg:'Sample error: agent connection failed (no API key set).',sample:1},
  {t:now-120000,lvl:'error',msg:'Sample error: task could not be delivered, agent offline.',sample:1}]});

// ---- Storage (localStorage, guarded) ----
let S,notice='',filter='all',logFilter='all',storageOk=true;
let previewPlan=null,workflowPollTimer=null,workflowPollCount=0;
const MAX_WORKFLOW_POLLS=60;
function stopWorkflowPolling(){if(workflowPollTimer){clearInterval(workflowPollTimer);workflowPollTimer=null;workflowPollCount=0;}}
function load(){
 try{
  const raw=localStorage.getItem(KEY);
  if(!raw)return seed();
  const d=JSON.parse(raw);
  if(!d||!Array.isArray(d.tasks)||!Array.isArray(d.logs)||!d.settings)throw new Error('bad shape');
  if(!d.ollama)d.ollama={connected:false,models:[]};
  if(!d.providers)d.providers=[];
  if(!d.blender)d.blender={available:false,executable:null,version:null};
  return d;
 }catch(e){
  storageOk=!(e&&e.name==='SecurityError');
  notice=storageOk?'Saved data was unreadable, so sample data was restored.':'Browser storage is unavailable. Tasks will not be saved after refresh.';
  return seed();
 }
}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(S));}
 catch(e){storageOk=false;notice='Could not save to browser storage. Changes will be lost on refresh.';}
}
function log(lvl,msg){S.logs.unshift({t:Date.now(),lvl,msg});S.logs.length=Math.min(S.logs.length,150)}

// ---- Helpers ----
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ag=id=>id==='workflow'?{name:'AI Workflow',icon:'⚡'}:(AGENTS.find(a=>a.id===id)||{name:'Unknown',icon:'?'});
const time=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const pill=s=>`<span class="pill s-${s}">${STATUS[s]}</span>`;
const isCat=(t,c)=>{
  if(c==='queued') return t.status==='pending'||t.status==='queued';
  if(c==='running') return t.status==='progress'||t.status==='running';
  if(c==='paused') return t.status==='paused';
  if(c==='completed') return t.status==='done'||t.status==='completed';
  if(c==='failed') return t.status==='failed';
  return t.status===c;
};
const countCat=c=>S.tasks.filter(t=>isCat(t,c)).length;
const bar=t=>{
  const pct = (typeof t.progress === 'number' && t.progress > 0) ? t.progress : (PCT[t.status] || 0);
  const isDone = t.status === 'done' || t.status === 'completed';
  return `<div class="bar ${isDone?'d':''}" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Progress"><i style="width:${pct}%"></i></div>`;
};
const NC='<span class="pill s-nc">Not Connected</span>';
const empty=(h,p)=>`<div class="empty"><b>${h}</b>${p}</div>`;
const logHtml=L=>L.map(l=>`<div class="log ${l.lvl}">[${time(l.t)}] ${l.lvl.toUpperCase()} · ${esc(l.msg)}${l.sample?'<span class="tag">sample</span>':''}</div>`).join('');
const count=s=>S.tasks.filter(t=>t.status===s).length;

function taskCard(t,ctl){
  const pct = (typeof t.progress === 'number' && t.progress > 0) ? t.progress : (PCT[t.status] || 0);
  const isQueued = t.status === 'pending' || t.status === 'queued';
  const isRunning = t.status === 'progress' || t.status === 'running';
  const isPaused = t.status === 'paused';
  const isFailed = t.status === 'failed';
  const isCompleted = t.status === 'done' || t.status === 'completed';

  let subtaskTag = '';
  if (t.parent_id) {
    subtaskTag = `<span class="tag" style="color:var(--purple);border-color:var(--purple)">Subtask of #${t.parent_id}</span>`;
  } else if (t.agent === 'workflow') {
    subtaskTag = `<span class="tag" style="color:var(--blue);border-color:var(--blue)">Workflow</span>`;
  }

  let depHtml = '';
  try {
    const deps = JSON.parse(t.depends_on || '[]');
    if (deps && deps.length) {
      depHtml = `<div class="mono mute" style="font-size:0.75rem;margin-top:2px">Depends on: ${deps.map(d=>'#'+d).join(', ')}</div>`;
    }
  } catch {}

  return `<div class="card task" id="task-card-${t.id}">
    <div class="row">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <b>${esc(t.title)}</b>
        ${subtaskTag}
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        ${t.current_step?`<span class="tag">Step: ${esc(t.current_step)}</span>`:''}
        ${pill(t.status)}
      </div>
    </div>
    <div class="row mono mute">
      <span>${ag(t.agent).icon} ${ag(t.agent).name} · ${t.priority} priority ${t.provider?`· [${esc(t.provider)}]`:''}</span>
      <span>${pct}%</span>
    </div>
    ${depHtml}
    ${bar(t)}
    ${t.retry_count?`<div class="mono mute" style="font-size:0.75rem;color:var(--warn)">Retries: ${t.retry_count}/${t.max_retries||3}</div>`:''}
    ${t.error?`<div style="color:var(--err);font-size:0.82rem;padding:6px 10px;background:rgba(255,77,125,0.08);border:1px solid rgba(255,77,125,0.3);border-radius:8px">⚠ ${esc(t.error)}</div>`:''}
    ${t.result?`<div style="margin-top:6px">
      ${t.result.includes('<svg')?`<div style="background:#0a0b26;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:6px;display:flex;justify-content:center;overflow:hidden">${t.result.slice(t.result.indexOf('<svg'), t.result.indexOf('</svg>')+6)}</div>`:''}
      <div style="background:#050616;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:220px;overflow-y:auto;font-family:var(--mono);font-size:0.8rem;white-space:pre-wrap;color:#bfe3ff"><code>${esc(t.result)}</code></div>
    </div>`:''}
    ${ctl?`<div class="row" style="margin-top:6px">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <label class="mute mono">Status <select data-act="status" data-id="${t.id}" aria-label="Change status of ${esc(t.title)}">
          <option value="queued" ${isQueued?'selected':''}>Queued</option>
          <option value="running" ${isRunning?'selected':''}>Running</option>
          <option value="paused" ${isPaused?'selected':''}>Paused</option>
          <option value="completed" ${isCompleted?'selected':''}>Completed</option>
          <option value="failed" ${isFailed?'selected':''}>Failed</option>
        </select></label>
        ${isQueued?`<button class="btn sm pri" data-act="run-gemini" data-id="${t.id}">Execute with ${ag(t.agent).name}</button>`:''}
        ${isRunning?`<button class="btn sm" data-act="pause-task" data-id="${t.id}">Pause</button>`:''}
        ${isPaused?`<button class="btn sm pri" data-act="resume-task" data-id="${t.id}">Resume</button>`:''}
        ${isFailed?`<button class="btn sm pri" data-act="retry-task" data-id="${t.id}">Retry</button>`:''}
      </div>
      <button class="btn sm" data-act="del" data-id="${t.id}">Delete</button>
    </div>`:''}
  </div>`;
}

function renderWorkflowCard(w){
  const subtasks = S.tasks.filter(t => t.parent_id === w.id).sort((a,b) => a.id - b.id);
  const pct = (typeof w.progress === 'number' && w.progress > 0) ? w.progress : (PCT[w.status] || 0);
  const isQueued = w.status === 'pending' || w.status === 'queued';
  const isRunning = w.status === 'progress' || w.status === 'running';
  const isCompleted = w.status === 'done' || w.status === 'completed';
  const isFailed = w.status === 'failed';

  let planSource = 'heuristic';
  let planSummary = '';
  let artifacts = [];
  if (w.checkpoint_data) {
    try {
      const cd = typeof w.checkpoint_data === 'string' ? JSON.parse(w.checkpoint_data) : w.checkpoint_data;
      if (cd.source) planSource = cd.source;
      if (cd.plan) planSummary = cd.plan;
      if (Array.isArray(cd.artifacts)) artifacts = cd.artifacts;
    } catch {}
  }

  const sourceBadge = planSource === 'gemini'
    ? '<span class="tag" style="color:var(--ok);border-color:var(--ok)">Gemini Cloud Plan</span>'
    : '<span class="tag" style="color:var(--warn);border-color:var(--warn)">Local Heuristic Plan</span>';

  const completedSubs = subtasks.filter(s => s.status === 'completed' || s.status === 'done').length;

  return `<div class="card task wf-card" style="margin-bottom:16px;border-left-color:${isCompleted?'var(--ok)':isFailed?'var(--err)':'var(--blue)'}" id="wf-card-${w.id}">
    <div class="row">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="tag" style="color:var(--blue);border-color:var(--blue);font-weight:700">Workflow #${w.id}</span>
        <b style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(w.title)}</b>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        ${sourceBadge}
        <span class="tag">${esc(w.priority)} Priority</span>
        ${pill(w.status)}
      </div>
    </div>
    ${planSummary ? `<div class="mute" style="font-size:0.83rem">${esc(planSummary)}</div>` : ''}
    ${artifacts.length > 0 ? `<div style="margin:8px 0;background:rgba(10,11,38,0.85);border:1px solid rgba(61,245,176,0.3);border-radius:8px;padding:8px 10px">
      <div class="row" style="margin-bottom:4px">
        <span style="color:var(--ok);font-size:0.82rem;font-weight:600">📁 Verified File Artifacts (${artifacts.length} file(s) on disk)</span>
        <span class="tag" style="color:var(--ok);border-color:var(--ok)">REAL · ON DISK</span>
      </div>
      <div style="display:grid;gap:3px">
        ${artifacts.map(a => `
          <div class="row mono mute" style="font-size:0.75rem">
            <span style="color:#bfe3ff">📄 ${esc(a.relativePath)}</span>
            <span>${a.size} bytes</span>
          </div>
        `).join('')}
      </div>
    </div>` : (isCompleted ? `<div style="margin:4px 0;font-size:0.76rem;color:var(--mute)">Artifacts: <span class="tag">Plan & Report Only (0 files written to disk)</span></div>` : '')}
    <div class="row mono mute" style="font-size:0.78rem">
      <span>Progress: ${completedSubs} of ${subtasks.length} subtask(s) completed</span>
      <span>${pct}%</span>
    </div>
    ${bar({ status: w.status, progress: pct })}

    ${w.error ? `<div style="color:var(--err);font-size:0.82rem;padding:6px 10px;background:rgba(255,77,125,0.08);border:1px solid rgba(255,77,125,0.3);border-radius:8px;margin-top:6px">⚠ ${esc(w.error)}</div>` : ''}

    <div class="row" style="margin-top:6px">

// ---- Backend (optional): used automatically when served by server.js ----
let mode='local';
async function req(method,url,body){
 const h={'X-Requested-With':'beyond'};if(body)h['Content-Type']='application/json';
 const r=await fetch(url,{method,headers:h,body:body?JSON.stringify(body):undefined});
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(d.error||('Request failed ('+r.status+')'));
 return d;
}
async function refresh(){const d=await req('GET','/api/state');S.tasks=d.tasks;S.logs=d.logs;S.settings=d.settings;if(d.ollama)S.ollama=d.ollama;if(d.providers)S.providers=d.providers;if(d.tools)S.tools=d.tools;if(d.categories)S.categories=d.categories;if(d.blender)S.blender=d.blender;}
async function detectBackend(){
 if(location.protocol==='file:')return;
 try{const c=new AbortController();setTimeout(()=>c.abort(),1500);
  const r=await fetch('/api/health',{signal:c.signal});
  if(r.ok&&(await r.json()).app==='project-beyond'){await refresh();mode='server';notice=''}
 }catch(e){}
}
// act(): run the server call in server mode, otherwise the local (browser storage) change
async function act(remote,local){
 if(mode==='server'){try{await remote();await refresh();notice=''}catch(e){notice='Backend error: '+e.message+'. Your change was not saved.'}}
 else{local();save()}
 render();
}

   render();
  }).catch(err=>{
   notice=`Failed to refresh workflow #${id}: ${err.message}`;
   render();
  });
 }
 if(a==='del-wf'){
  if(!confirm(`Delete workflow #${id} and all its subtasks?`))return;
  b.disabled=true;b.textContent='Deleting...';
  return act(async()=>{
   await req('DELETE','/api/tasks/'+id);
  },()=>{
   S.tasks=S.tasks.filter(x=>x.id!==+id&&x.parent_id!==+id);
   log('info',`Workflow #${id} and subtasks deleted.`);
  });
 }
 if(a==='tool-filter'){
  window.toolFilter = id;
  return render();
 }
 if(a==='search-hf'){
  const inp = $('#hf-search-input');
  const q = inp ? inp.value.trim() : 'qwen';
  b.disabled = true; b.textContent = 'Searching...';
  return req('GET', '/api/tools/hf/models?q=' + encodeURIComponent(q)).then(res=>{
    b.disabled = false; b.textContent = 'Search Models';
    const container = $('#hf-results-container');
    if(!container) return;
    if(!res.ok || !res.models || !res.models.length){
      container.innerHTML = '<span style="color:var(--warn)">No models found for query: ' + esc(q) + '</span>';
      return;
    }
    container.innerHTML = `<div style="display:grid;gap:6px;margin-top:8px">${res.models.map(m=>`
      <div style="display:flex;justify-content:space-between;padding:6px 8px;background:#050616;border-radius:6px;border:1px solid var(--line)">
        <a href="${esc(m.url)}" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:none">${esc(m.id)}</a>
        <span class="mute">${m.downloads.toLocaleString()} downloads · ${m.likes} likes · [${esc(m.pipeline_tag)}]</span>
      </div>
    `).join('')}</div>`;
  }).catch(err=>{
    b.disabled = false; b.textContent = 'Search Models';
    const container = $('#hf-results-container');
    if(container) container.innerHTML = '<span style="color:var(--err)">Search error: ' + esc(err.message) + '</span>';
  });
 }
 if(a==='del'){const t=S.tasks.find(t=>t.id===+id);return act(()=>req('DELETE','/api/tasks/'+id),()=>{S.tasks=S.tasks.filter(x=>x.id!==+id);if(t)log('info',`Task deleted: "${t.title}"`)})}
 if(a==='clearlogs')return act(()=>req('DELETE','/api/logs'),()=>{S.logs=[]});
 if(a==='reset'){if(!confirm('Delete all tasks and logs and restore the samples?'))return;filter='all';logFilter='all';return act(()=>req('POST','/api/reset'),()=>{S=seed();notice=''})}
});

(async()=>{S=load();await detectBackend();route()})();
</script>
</body>
</html>
